<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Efficiency Playbook</title>
  <desc id="d">Evidence-based, token-efficient setup for Claude Code and Codex on Windows.</desc>
  <style>
    .title { font: 700 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0f172a; letter-spacing: -1.5px; }
    .sub { font: 400 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #334155; }
    .muted { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #64748b; }
    .chip { fill: #ecfdf9; stroke: #b3ece0; }
    .ct { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0f766e; letter-spacing: 1.6px; }
    .pill { fill: #ffffff; stroke: #d6dde8; }
    .pt { font: 500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1e293b; }
    .card { fill: #0f172a; stroke: #1e293b; }
    .bar { fill: #1b2536; }
    .m { font: 400 17px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .host1 { fill: #2dd4bf; } .host2 { fill: #b69cff; } .cmd { fill: #e8ecfa; } .dim { fill: #aeb8d6; }
    .out { font: 400 16px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #aeb8d6; }
    .ok { stroke: #34d399; }
    .cursor { fill: #2dd4bf; }
    @media (prefers-reduced-motion: no-preference) { .cursor { animation: blink 1.1s steps(1) infinite; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5fb"/></linearGradient>
    <radialGradient id="ga" cx="0.12" cy="0.1" r="0.55"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.14"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="0.92" cy="0.95" r="0.6"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity="0.06"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.2"/><stop offset="0.55" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="gm"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" mask="url(#gm)"/>
  <rect width="1280" height="400" fill="url(#ga)"/>
  <rect width="1280" height="400" fill="url(#gb)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
  <g transform="translate(0 0)">

  <rect x="72" y="70" width="328" height="30" rx="15" class="chip"/>
  <text x="236" y="90" class="ct" text-anchor="middle">CLAUDE CODE  ·  CODEX  ·  WINDOWS</text>
  <text x="70" y="176" class="title">Efficiency Playbook</text>
  <text x="72" y="222" class="sub">Evidence-based, token-efficient setup for AI coding agents</text>
  <rect x="72" y="266" width="212" height="38" rx="19" class="pill"/><text x="178" y="291" class="pt" text-anchor="middle">Asks before each change</text>
  <rect x="294" y="266" width="186" height="38" rx="19" class="pill"/><text x="387" y="291" class="pt" text-anchor="middle">Backups and rollback</text>
  <rect x="490" y="266" width="200" height="38" rx="19" class="pill"/><text x="590" y="291" class="pt" text-anchor="middle">Every verdict sourced</text>
  <text x="72" y="350" class="muted">Open source (MIT) · One plugin for both hosts · Windows 10 and 11</text>

  <rect x="720" y="62" width="496" height="280" rx="14" class="card"/>
  <path d="M734 62h468a14 14 0 0 1 14 14v22H720V76a14 14 0 0 1 14-14z" class="bar"/>
  <circle cx="742" cy="80" r="5.5" fill="#ff5f57"/><circle cx="760" cy="80" r="5.5" fill="#febc2e"/><circle cx="778" cy="80" r="5.5" fill="#28c840"/>
  <text x="744" y="136" class="m"><tspan class="host1">claude</tspan><tspan class="dim"> › </tspan><tspan class="cmd">/efficiency-playbook:setup</tspan></text>
  <text x="744" y="168" class="m"><tspan class="host2">codex </tspan><tspan class="dim"> › </tspan><tspan class="cmd">$efficiency-playbook:setup</tspan></text>
  <path class="ok" d="M752 217l4 4 8-9" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="776" y="222" class="out">rules and command map written</text>
  <path class="ok" d="M752 247l4 4 8-9" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="776" y="252" class="out">setup skills installed</text>
  <path class="ok" d="M752 277l4 4 8-9" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="776" y="282" class="out">only the settings you approved</text>
  <path class="ok" d="M752 307l4 4 8-9" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="776" y="312" class="out">manifest saved for rollback</text>
  <rect x="752" y="324" width="10" height="3" class="cursor"/>
  </g>
</svg>
